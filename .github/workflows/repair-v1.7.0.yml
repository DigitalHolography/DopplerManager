name: Repair v1.7.0 release asset

on:
  push:
    branches:
      - release-v1.7.0-repair

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare draft release
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $ApiBase = "https://api.github.com/repos/${{ github.repository }}"
          $Releases = Invoke-RestMethod -Headers $Headers -Uri "$ApiBase/releases?per_page=100"
          $Release = $Releases | Where-Object { $_.tag_name -eq "v1.7.0" } | Select-Object -First 1

          if ($Release -and -not $Release.draft) {
            if ($Release.assets.Count -gt 0) {
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "already_published=true"
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "asset_exists=true"
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "release_id=$($Release.id)"
              exit 0
            }
            Invoke-RestMethod -Method Delete -Headers $Headers -Uri "$ApiBase/releases/$($Release.id)"
            $Release = $null
          }

          if (-not $Release) {
            $Body = @{
              tag_name = "v1.7.0"
              name = "Doppler manager v1.7.0"
              draft = $true
              prerelease = $false
              generate_release_notes = $true
            } | ConvertTo-Json
            $Release = Invoke-RestMethod -Method Post -Headers $Headers -Uri "$ApiBase/releases" `
              -Body $Body -ContentType "application/json"
          }

          $Asset = $Release.assets | Where-Object { $_.name -eq "DopplerManager-1.7.0-setup.exe" } | Select-Object -First 1
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "already_published=false"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("asset_exists=$($null -ne $Asset)".ToLowerInvariant())
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "release_id=$($Release.id)"

      - name: Install uv
        if: steps.release.outputs.asset_exists != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        if: steps.release.outputs.asset_exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        if: steps.release.outputs.asset_exists != 'true'
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build v1.7.0 installer
        if: steps.release.outputs.asset_exists != 'true'
        shell: powershell
        run: .\scripts\build_scan_release.ps1 -Version 1.7.0

      - name: Upload installer asset
        if: steps.release.outputs.asset_exists != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $ReleaseId = "${{ steps.release.outputs.release_id }}"
          $AssetName = "DopplerManager-1.7.0-setup.exe"
          $UploadName = [Uri]::EscapeDataString($AssetName)
          Invoke-RestMethod -Method Post -Headers $Headers `
            -Uri "https://uploads.github.com/repos/${{ github.repository }}/releases/$ReleaseId/assets?name=$UploadName" `
            -InFile "dist/installer/$AssetName" `
            -ContentType "application/octet-stream"

      - name: Publish v1.7.0 release
        if: steps.release.outputs.already_published != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ReleaseId = "${{ steps.release.outputs.release_id }}"
          $Result = gh api --method PATCH `
            "repos/${{ github.repository }}/releases/$ReleaseId" `
            -F draft=false 2>&1
          if ($LASTEXITCODE -ne 0) {
            $Message = (($Result | Out-String).Trim() -replace "`r?`n", " ")
            Write-Output "::error title=GitHub release publish failed::$Message"
            exit 1
          }
