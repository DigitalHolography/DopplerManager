[project]
name = "doppler-manager"
version = "0.5.0"
description = "Streamlit MVP for detecting and verifying Holodoppler processing pipelines on NAS folders."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.5",
    "pandas>=2.0,<3",
    "pyarrow>=23,<24",
    "streamlit>=1.35",
]

[project.scripts]
dopplermanager = "doppler_manager.launcher:launch"

[project.optional-dependencies]
processing = [
    "holodoppler @ git+https://github.com/DigitalHolography/HoloDoppler.git@dev",
    "dopplerview @ git+https://github.com/DigitalHolography/DopplerView.git@varying_HD_output_keys",
    "onnxruntime>=1.25,<1.26",
    "EyeFlow @ git+https://github.com/DigitalHolography/EyeFlow.git@main",
    "AngioEye @ git+https://github.com/DigitalHolography/AngioEye.git@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]
release = ["pyinstaller>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/doppler_manager"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
